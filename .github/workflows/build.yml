name: build

# À chaque push : compile l'app (comme build.sh), lance les tests du sampler MIDI et
# démarre l'app quelques secondes en mode démo pour vérifier qu'elle ne plante pas.
# Sur main, si la version de build.sh n'a pas encore de release : publie la release GitHub
# (DMG + SHA-256, notes du CHANGELOG), celle que lit la mise à jour automatique, et met à jour
# le DMG du dépôt. Publier une version = changer la version dans build.sh + CHANGELOG, pousser.
on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: NOINSTALL=1 ./build.sh

      - name: Sampler & MIDI tests
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          swiftc -O -sdk "$SDK" -target "$(uname -m)-apple-macos13.0" -module-name SamplerTests \
            -framework AVFoundation -framework CoreMIDI \
            Tests/main.swift Src/SamplerVoices.swift Src/MidiInput.swift -o "$RUNNER_TEMP/sampler-tests"
          "$RUNNER_TEMP/sampler-tests"

      - name: Launch smoke test (demo mode)
        run: |
          APP="${TMPDIR:-/tmp}/AudioLook-build/AudioLook.app"
          "$APP/Contents/MacOS/AudioLook" -demoData YES > "$RUNNER_TEMP/app.log" 2>&1 &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then echo "✓ AudioLook tourne toujours après 10 s"; kill "$PID"
          else echo "✗ AudioLook s'est arrêté"; cat "$RUNNER_TEMP/app.log"; exit 1; fi

      - name: Window screenshots (demo mode, light and dark)
        continue-on-error: true
        run: |
          APP="${TMPDIR:-/tmp}/AudioLook-build/AudioLook.app"
          mkdir -p "$RUNNER_TEMP/shots"
          for mode in light dark; do
            if [ "$mode" = dark ]; then defaults write -g AppleInterfaceStyle Dark; else defaults delete -g AppleInterfaceStyle 2>/dev/null || true; fi
            "$APP/Contents/MacOS/AudioLook" -demoData YES -demoLoopA 0.25 -demoLoopB 0.5 -demoTargetBPM 140 -demoTranspose 3 > /dev/null 2>&1 &
            PID=$!
            sleep 8
            screencapture -x "$RUNNER_TEMP/shots/screen-$mode.png" || true
            kill "$PID" 2>/dev/null || true
            sleep 1
          done
          defaults delete -g AppleInterfaceStyle 2>/dev/null || true
          ls -la "$RUNNER_TEMP/shots"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/shots

      - name: Disk image
        run: |
          APP="${TMPDIR:-/tmp}/AudioLook-build/AudioLook.app" ./makedmg.command
          shasum -a 256 AudioLook.dmg | awk '{print $1"  AudioLook.dmg"}' > AudioLook.dmg.sha256
          cat AudioLook.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AudioLook-${{ github.sha }}
          path: |
            AudioLook.dmg
            AudioLook.dmg.sha256

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'CFBundleShortVersionString' build.sh | sed -E 's/.*<string>([^<]+)<\/string>.*/\1/')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à la version de build.sh ($VERSION)"; exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "Release $VERSION déjà publiée : rien à faire."; exit 0; fi
          NOTES=$(awk -v v="## $VERSION " 'index($0, v) == 1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          [ -n "$NOTES" ] || NOTES="AudioLook $VERSION"
          gh release create "$VERSION" --target "$GITHUB_SHA" AudioLook.dmg AudioLook.dmg.sha256 --title "AudioLook $VERSION" --notes "$NOTES"
          # le DMG du dépôt (lien du README) suit la release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv AudioLook.dmg "$RUNNER_TEMP/AudioLook.dmg"
          git fetch origin main
          git checkout -f -B main origin/main
          cp "$RUNNER_TEMP/AudioLook.dmg" AudioLook.dmg
          git add AudioLook.dmg
          git diff --cached --quiet || { git commit -m "Release $VERSION (DMG)"; git push origin main; }
